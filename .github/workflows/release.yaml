name: Release
run-name: ${{ inputs.request_id || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: vX.Y.Z or vX.Y.Z-dev.YYYYMMDD.HHMMSSZ
        required: true
        type: string
      source_sha:
        description: Optional immutable synchronized source commit
        type: string
        default: ""
      request_id:
        description: Optional caller correlation ID
        type: string
        default: ""
      dry_run:
        description: Validate, test and build without creating tags or publishing
        type: boolean
        default: true
      prerelease:
        description: Mark the GitHub release as a prerelease; dev versions always are
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  RELEASE_VERSION: ${{ inputs.version }}
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  MARK_PRERELEASE: ${{ inputs.prerelease }}
  VERTESIA_LIVE_TESTS: "0"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate synchronized source
        run: python scripts/release_cohort.py validate --lang python
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Apply generation patches
        run: python scripts/patch_forward_compat_enums.py
      - name: Test SDK
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m unittest discover -s test
      - name: Stamp unique artifact version
        run: python scripts/release_cohort.py stamp --lang python
      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  prepare-tag:
    name: Prepare immutable source tag
    needs: build
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create or verify the immutable source tag and GitHub release.
    outputs:
      published: ${{ steps.registry.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check prior publication
        id: registry
        run: python3 scripts/release_cohort.py registry --lang python
      - name: Create immutable source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_cohort.py tag --lang python

  publish-pypi:
    name: Publish PyPI
    needs: [build, prepare-tag]
    if: inputs.dry_run == false && needs.prepare-tag.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing.
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  github-release:
    name: Publish GitHub release
    needs: [build, prepare-tag, publish-pypi]
    if: >-
      !cancelled() && inputs.dry_run == false && needs.build.result == 'success' &&
      needs.prepare-tag.result == 'success' &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create or verify the immutable source tag and GitHub release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Create or resume GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_cohort.py release --lang python

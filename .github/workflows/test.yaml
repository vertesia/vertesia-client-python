name: Test

on:
  push:
    branches: [main, "release/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.role }}
    # Later Ubuntu images have no Python 3.9 build, and this line still supports it.
    runs-on: ubuntu-24.04
    env:
      VERTESIA_LIVE_TESTS: "0"
    strategy:
      matrix:
        # Required checks name the roles, so moving a version needs no ruleset or policy change.
        include:
          - role: oldest
            python-version: "3.9"
          - role: latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff checks
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run unit tests
        run: python -m unittest discover -s test
